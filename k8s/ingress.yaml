apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-tw-site
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: my-tw-site.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-tw-site
                port:
                  number: 80
