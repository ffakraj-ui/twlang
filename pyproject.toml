[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-framework"
version = "0.9.09"
description = "TW framework CLI with create, dev, build, and deploy commands"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "KANISHK KUMAR", email = "mlkraj290@gmail.com" }
]
maintainers = [
  { name = "Kanishk Kumar", email = "mlkraj290@gmail.com" }
]
keywords = ["tw", "tw-framework", "twlang", "framework", "cli", "static-site"]
dependencies = []

[project.optional-dependencies]
# Dev / contributor tooling (not required to use the framework)
dev = [
  "pytest>=7",
]

[project.scripts]
tw = "tw_framework.cli:main"

[tool.setuptools.packages.find]
include = ["tw_framework*"]

[tool.setuptools.package-data]
tw_framework = ["*.js"]
